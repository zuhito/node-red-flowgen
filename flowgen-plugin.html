<style>
#red-ui-clipboard-dialog-import-tab-apispec {
  display: none;
  height: 100%;
  max-height: 100%;
  padding: 10px;
  box-sizing: border-box;
  overflow: hidden;
}
#red-ui-clipboard-dialog-import-tab-apispec.flowgen-shown {
  display: flex !important;
  flex-direction: column;
}
#flowgen-paste-view, #flowgen-select-view {
  display: none;
  flex: 1 1 auto;
  min-height: 0;
  flex-direction: column;
}
#flowgen-paste-view.flowgen-on, #flowgen-select-view.flowgen-on { display: flex; }
.flowgen-grow { flex: 1 1 auto; min-height: 0; display: flex; overflow: hidden; }
.flowgen-bar {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.flowgen-bar > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flowgen-bar .flowgen-spacer { flex: 1 1 auto; }
a#flowgen-select-btn.red-ui-button {
  background: #ad1625 !important;
  border: 1px solid #ad1625 !important;
  color: #fff !important;
}
a#flowgen-select-btn.red-ui-button:hover,
a#flowgen-select-btn.red-ui-button:focus,
a#flowgen-select-btn.red-ui-button:active {
  background: #6e1018 !important;
  border-color: #6e1018 !important;
  color: #fff !important;
}
a#flowgen-select-btn.red-ui-button i, a#flowgen-select-btn.red-ui-button span {
  color: #fff !important;
}
#flowgen-spec-text {
  width: 100%;
  height: 100%;
  resize: none;
  font-family: var(--red-ui-monospace-font, monospace);
  font-size: 13px;
  line-height: 1.3em;
  padding: 6px 10px;
  box-sizing: border-box;
}
#flowgen-op-list {
  width: 100%;
  height: 100%;
  border: 1px solid var(--red-ui-secondary-border-color, #ccc);
  overflow-y: auto;
  overflow-x: hidden;
  box-sizing: border-box;
  outline: none;
}
#flowgen-op-list .flowgen-op {
  display: flex;
  align-items: center;
  margin: 0 0 4px 0;
  padding: 5px;
  cursor: pointer;
  border-radius: 4px;
  border: 1px solid transparent;
  background: rgba(97, 175, 254, 0.1);
  border-color: #61affe;
  font-family: sans-serif;
}
#flowgen-op-list .flowgen-op .flowgen-method {
  flex: 0 0 auto;
  min-width: 80px;
  padding: 6px 0;
  text-align: center;
  border-radius: 3px;
  background: #61affe;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  font-family: sans-serif;
}
#flowgen-op-list .flowgen-op .flowgen-path {
  flex: 0 0 auto;
  padding: 0 10px;
  font-size: 16px;
  font-weight: 600;
  color: #3b4151;
  font-family: sans-serif;
  word-break: break-word;
}
#flowgen-op-list .flowgen-op .flowgen-summary {
  flex: 1 1 auto;
  font-size: 13px;
  color: #3b4151;
  font-family: sans-serif;
}
#flowgen-op-list .flowgen-op.flowgen-get    { background: rgba(97,175,254,.1); border-color: #61affe; }
#flowgen-op-list .flowgen-op.flowgen-get    .flowgen-method { background: #61affe; }
#flowgen-op-list .flowgen-op.flowgen-post   { background: rgba(73,204,144,.1); border-color: #49cc90; }
#flowgen-op-list .flowgen-op.flowgen-post   .flowgen-method { background: #49cc90; }
#flowgen-op-list .flowgen-op.flowgen-put    { background: rgba(252,161,48,.1); border-color: #fca130; }
#flowgen-op-list .flowgen-op.flowgen-put    .flowgen-method { background: #fca130; }
#flowgen-op-list .flowgen-op.flowgen-delete { background: rgba(249,62,62,.1); border-color: #f93e3e; }
#flowgen-op-list .flowgen-op.flowgen-delete .flowgen-method { background: #f93e3e; }
#flowgen-op-list .flowgen-op.flowgen-patch  { background: rgba(80,227,194,.1); border-color: #50e3c2; }
#flowgen-op-list .flowgen-op.flowgen-patch  .flowgen-method { background: #50e3c2; }
#flowgen-op-list .flowgen-op.flowgen-head,
#flowgen-op-list .flowgen-op.flowgen-options,
#flowgen-op-list .flowgen-op.flowgen-trace  { background: rgba(144,18,254,.1); border-color: #9012fe; }
#flowgen-op-list .flowgen-op.flowgen-head   .flowgen-method,
#flowgen-op-list .flowgen-op.flowgen-options .flowgen-method,
#flowgen-op-list .flowgen-op.flowgen-trace  .flowgen-method { background: #9012fe; }
#flowgen-op-list .flowgen-op.selected {
  box-shadow: 0 0 0 2px var(--red-ui-form-input-focus-color, #ad1625) inset;
}
#flowgen-status { flex: 0 0 auto; margin-top: 6px; min-height: 16px; font-size: 12px; }
#flowgen-status:empty { min-height: 0; margin: 0; }
#flowgen-status.flowgen-error { color: var(--red-ui-text-color-error, #a33); }
#flowgen-prompt { flex: 0 0 auto; }
</style>

<script type="text/javascript">
(function () {
  var TAB_ID = 'red-ui-clipboard-dialog-import-tab-apispec';
  var loading = null;
  var doc = null;
  var selected = null;
  var isActive = false;
  var fetching = null;

  var PLACEHOLDER = [
    'openapi: 3.0.4',
    'info:',
    '  title: Swagger Petstore',
    '  version: 1.0.0',
    'servers:',
    '  - url: https://petstore3.swagger.io/api/v3',
    'paths:',
    '  /pet/{petId}:',
    '    get:',
    '      parameters:',
    '        - name: petId',
    '          in: path',
    '          required: true',
    '',
    'or',
    'https://petstore.swagger.io/v2/swagger.json'
  ].join('\n');

  function load() {
    if (loading) { return loading; }
    var root = (RED.settings.apiRootUrl || '');
    if (root && !/\/$/.test(root)) { root += '/'; }
    loading = $.getScript(root + 'flowgen/js-yaml.min.js').then(function () {
      return $.getScript(root + 'flowgen/flowgen.js');
    });
    return loading;
  }

  function status(text, isError) {
    $('#flowgen-status').text(text || '').toggleClass('flowgen-error', !!isError);
  }

  function render() {
    var list = $('#flowgen-op-list').empty();
    selected = null;
    $('#flowgen-select-btn').hide();
    okButton(false);
    if (!doc) { return; }
    var result;
    try {
      result = flowgen.listOperations(doc);
    } catch (err) {
      status(err.message, true);
      return;
    }
    if (!result.count) {
      status('no operations found in this document', true);
      return;
    }
    status('');
    result.operations.forEach(function (op) {
      $('<div>').addClass('flowgen-op flowgen-' + op.method)
        .append($('<span>').addClass('flowgen-method').text(op.method.toUpperCase()))
        .append($('<span>').addClass('flowgen-path').text(op.path))
        .append($('<span>').addClass('flowgen-summary').text(op.summary || ''))
        .on('click', function () {
          choose($(this), op);
        })
        .on('dblclick', function () {
          choose($(this), op);
          importSelected();
        })
        .data('flowgen-op', op)
        .appendTo(list);
    });

    if (result.count === 1) {
      selected = result.operations[0];
      $('#flowgen-op-list .flowgen-op').addClass('selected');
      okButton(true);
    } else {
      $('#flowgen-select-btn').show();
    }
  }

  function reset() {
    doc = null;
    selected = null;
    $('#flowgen-op-list').empty();
    $('#flowgen-select-btn').hide();
    okButton(false);
  }

  function parse(text) {
    reset();
    if (!text || !text.trim()) { status(''); return; }
    if (flowgen.isUrl(text)) { return fetchSpec(text.trim()); }
    try {
      doc = flowgen.parseDocument(text);
      render();
    } catch (err) {
      status(err.message, true);
    }
  }

  function pretty(text) {
    try { return JSON.stringify(JSON.parse(text), null, 2); } catch (err) { return text; }
  }

  function fetchSpec(url) {
    if (fetching === url) { return; }
    fetching = url;
    status('fetching ' + url);
    fetch(url).then(function (res) {
      if (!res.ok) { throw new Error('HTTP ' + res.status + ' from ' + url); }
      return res.text();
    }).then(function (text) {
      fetching = null;
      var formatted = pretty(text);
      $('#flowgen-spec-text').val(formatted);
      parse(formatted);
    }).catch(function (err) {
      fetching = null;
      status('could not fetch the document: ' + err.message, true);
    });
  }

  function content() {
    var el = $('<div>').attr('id', TAB_ID);

    var paste = $('<div>').attr('id', 'flowgen-paste-view').addClass('flowgen-on').appendTo(el);

    $('<div>').addClass('flowgen-bar').attr('id', 'flowgen-prompt')
      .append($('<span>').text('Paste an API Specification or its URL, or '))
      .append($('<a>').addClass('red-ui-button').attr('id', 'flowgen-file-btn')
        .append('<i class="fa fa-upload"></i> ')
        .append($('<span>').text('select a file')))
      .append($('<input>').attr({ type: 'file', id: 'flowgen-file', accept: '.json,.yaml,.yml,.bru' })
        .css('display', 'none'))
      .append($('<span>').addClass('flowgen-spacer'))
      .append($('<a>').addClass('red-ui-button').attr({ id: 'flowgen-select-btn', href: '#' })
        .append($('<span>').text('Select endpoint '))
        .append('<i class="fa fa-chevron-right"></i>').hide())
      .on('keydown', function (ev) { if (ev.keyCode === 13) { ev.preventDefault(); } })
      .appendTo(paste);

    $('<div>').addClass('flowgen-grow')
      .append($('<textarea>').attr({ id: 'flowgen-spec-text', placeholder: PLACEHOLDER }))
      .appendTo(paste);

    var select = $('<div>').attr('id', 'flowgen-select-view').appendTo(el);

    $('<div>').addClass('flowgen-bar')
      .append($('<span>').text('Choose the endpoint to import.'))
      .append($('<span>').addClass('flowgen-spacer'))
      .append($('<a>').addClass('red-ui-button').attr({ id: 'flowgen-back-btn', href: '#' })
        .css({ background: '#fff', border: '1px solid #ccc', color: '#888' })
        .append('<i class="fa fa-chevron-left"></i> ')
        .append($('<span>').text('Back')))
      .appendTo(select);

    $('<div>').addClass('flowgen-grow')
      .append($('<div>').attr({ id: 'flowgen-op-list', tabindex: '0' })
        .on('keydown', function (ev) {
          if (ev.keyCode === 40) { ev.preventDefault(); moveSelection(1); }
          if (ev.keyCode === 38) { ev.preventDefault(); moveSelection(-1); }
        }))
      .appendTo(select);

    $('<div>').attr('id', 'flowgen-status').appendTo(el);

    el.find('#flowgen-select-btn').on('click', function (ev) {
      ev.preventDefault();
      view('select');
      $('#flowgen-op-list').trigger('focus');
    });
    el.find('#flowgen-back-btn').on('click', function (ev) {
      ev.preventDefault();
      view('paste');
    });

    el.find('#flowgen-file-btn').on('click', function (ev) {
      ev.preventDefault();
      el.find('#flowgen-file').val('').trigger('click');
    });
    el.find('#flowgen-file').on('change', function () {
      var file = this.files && this.files[0];
      if (!file) { return; }
      var reader = new FileReader();
      reader.onload = function (ev) {
        var formatted = pretty(ev.target.result);
        $('#flowgen-spec-text').val(formatted);
        parse(formatted);
      };
      reader.readAsText(file);
    });
    el.find('#flowgen-spec-text').on('change paste keyup', function () {
      var text = $(this).val();
      clearTimeout(el.data('timer'));
      el.data('timer', setTimeout(function () { parse(text); }, 250));
    });

    return el;
  }

  function choose(row, op) {
    $('#flowgen-op-list .flowgen-op').removeClass('selected');
    row.addClass('selected');
    selected = op;
    okButton(true);
    if (row[0] && row[0].scrollIntoView) { row[0].scrollIntoView({ block: 'nearest' }); }
  }

  function moveSelection(delta) {
    var rows = $('#flowgen-op-list .flowgen-op');
    if (!rows.length) { return; }
    var at = rows.index(rows.filter('.selected'));
    var next = at === -1 ? (delta > 0 ? 0 : rows.length - 1) : at + delta;
    if (next < 0 || next >= rows.length) { return; }
    var row = rows.eq(next);
    choose(row, row.data('flowgen-op'));
  }

  function view(name) {
    $('#flowgen-paste-view').toggleClass('flowgen-on', name === 'paste');
    $('#flowgen-select-view').toggleClass('flowgen-on', name === 'select');
  }

  function active() {
    return isActive && $('#' + TAB_ID).length > 0;
  }

  function okButton(enabled) {
    var ok = $('#red-ui-clipboard-dialog-ok');
    if (ok.button && ok.data('ui-button')) {
      ok.button(enabled ? 'enable' : 'disable');
    } else {
      ok.prop('disabled', !enabled);
    }
  }

  function show() {
    $('#red-ui-clipboard-dialog-import-tabs-content').children().hide();
    $('#' + TAB_ID).css('display', 'flex').addClass('flowgen-shown');
    isActive = true;
  }

  function hide(targetContentId) {
    isActive = false;
    $('#' + TAB_ID).hide().removeClass('flowgen-shown');
    if (targetContentId) { $('#' + targetContentId).show(); }
    okButton(false);
    $('#red-ui-clipboard-dialog-import-text').trigger('keyup');
  }

  function importSelected() {
    if (!doc || !selected) { return; }
    var nodes;
    try {
      nodes = flowgen.buildFlow(doc, selected.method, selected.path, { tab: false });
    } catch (err) {
      status(err.message, true);
      return;
    }
    var newFlow = $('#red-ui-clipboard-dialog-import-opt > a.selected')
      .attr('id') === 'red-ui-clipboard-dialog-import-opt-new';
    RED.view.importNodes(nodes, { generateIds: true, addFlow: newFlow });
    $('#red-ui-clipboard-dialog').dialog('close');
    RED.view.focus();
  }

  function preventSubmit() {
    $('#red-ui-clipboard-dialog').find('form').off('submit.flowgen')
      .on('submit.flowgen', function (ev) { ev.preventDefault(); });
  }

  function interceptOk() {
    var ok = document.getElementById('red-ui-clipboard-dialog-ok');
    if (!ok || ok.getAttribute('data-flowgen-bound')) { return; }
    ok.setAttribute('data-flowgen-bound', 'true');
    ok.addEventListener('click', function (ev) {
      if (!active()) { return; }
      ev.preventDefault();
      ev.stopPropagation();
      if (ev.stopImmediatePropagation) { ev.stopImmediatePropagation(); }
      importSelected();
    }, true);
  }

  function install() {
    var tabs = $('#red-ui-clipboard-dialog-import-tabs');
    if (!tabs.length || tabs.find('#flowgen-tab-link').length) { return; }

    var li = $('<li>').attr('id', 'red-ui-tab-' + TAB_ID).addClass('red-ui-tab')
      .append($('<a>').attr({ id: 'flowgen-tab-link', href: '#' })
        .addClass('red-ui-tab-label').text('API Spec'))
      .appendTo(tabs);

    content().appendTo('#red-ui-clipboard-dialog-import-tabs-content');

    interceptOk();
    preventSubmit();

    li.on('click', function (ev) {
      ev.preventDefault();
      tabs.find('li').removeClass('active');
      li.addClass('active');
      show();
      view(selected || !doc ? 'paste' : 'select');
      okButton(!!selected);
      load().then(function () {
        parse($('#flowgen-spec-text').val());
      }).catch(function (err) {
        status('failed to load flowgen: ' + err, true);
      });
    });

    tabs.on('click', 'li', function () {
      if (this === li[0]) { return; }
      li.removeClass('active');
      hide(String(this.id || '').replace(/^red-ui-tab-/, ''));
    });
  }

  RED.plugins.registerPlugin('node-red-flowgen', {
    onadd: function () {
      $(document).on('dialogopen', function (ev) {
        if (ev.target && ev.target.id === 'red-ui-clipboard-dialog') {
          setTimeout(install, 0);
        }
      });
    }
  });
})();
</script>
