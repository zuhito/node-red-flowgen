<style>
#red-ui-clipboard-dialog-import-tab-apispec {
  display: none;
  height: 100%;
  max-height: 100%;
  padding: 8px 8px 0 8px;
  box-sizing: border-box;
  overflow: hidden;
}
#red-ui-clipboard-dialog-import-tab-apispec.flowgen-shown { display: flex; flex-direction: column; }
#flowgen-paste-view, #flowgen-select-view {
  display: none;
  flex: 1 1 auto;
  min-height: 0;
  flex-direction: column;
}
#flowgen-paste-view.flowgen-on, #flowgen-select-view.flowgen-on { display: flex; }
.flowgen-grow { flex: 1 1 auto; min-height: 0; display: flex; overflow: hidden; }
.flowgen-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.flowgen-bar .flowgen-spacer { flex: 1 1 auto; }
#flowgen-select-btn, #flowgen-back-btn {
  background: var(--red-ui-workspace-button-background-active, #ad1625);
  border-color: var(--red-ui-workspace-button-background-active, #ad1625);
  color: #fff;
}
#flowgen-select-btn:hover, #flowgen-back-btn:hover {
  background: var(--red-ui-workspace-button-background-hover, #6e1018);
  border-color: var(--red-ui-workspace-button-background-hover, #6e1018);
  color: #fff;
}
#flowgen-spec-text {
  width: 100%;
  height: 100%;
  resize: none;
  font-family: monospace;
}
#flowgen-op-list {
  width: 100%;
  border: 1px solid var(--red-ui-secondary-border-color, #ccc);
  overflow-y: auto;
  overflow-x: hidden;
}
#flowgen-op-list .flowgen-op {
  padding: 3px 6px;
  cursor: pointer;
  border-bottom: 1px solid var(--red-ui-tertiary-border-color, #eee);
  font-family: monospace;
  font-size: 12px;
}
#flowgen-op-list .flowgen-op.selected {
  background: var(--red-ui-list-item-background-selected, #efefef);
}
#flowgen-op-list .flowgen-op .flowgen-method {
  display: inline-block;
  width: 62px;
  font-weight: bold;
}
#flowgen-op-list .flowgen-op .flowgen-summary {
  color: var(--red-ui-secondary-text-color, #999);
  margin-left: 8px;
}
#flowgen-status { flex: 0 0 auto; margin: 4px 0; min-height: 16px; font-size: 12px; }
#flowgen-prompt { flex: 0 0 auto; margin: 0; }
#flowgen-status.flowgen-error { color: var(--red-ui-text-color-error, #a33); }
</style>

<script type="text/javascript">
(function () {
  var TAB_ID = 'red-ui-clipboard-dialog-import-tab-apispec';
  var loading = null;
  var doc = null;
  var selected = null;
  var isActive = false;
  var fetching = null;

  var PLACEHOLDER = [
    'openapi: 3.0.4',
    'info:',
    '  title: Swagger Petstore',
    '  version: 1.0.0',
    'servers:',
    '  - url: https://petstore3.swagger.io/api/v3',
    'paths:',
    '  /pet/{petId}:',
    '    get:',
    '      parameters:',
    '        - name: petId',
    '          in: path',
    '          required: true',
    '',
    'or',
    'https://petstore.swagger.io/v2/swagger.json'
  ].join('\n');

  function load() {
    if (loading) { return loading; }
    var root = (RED.settings.apiRootUrl || '');
    if (root && !/\/$/.test(root)) { root += '/'; }
    loading = $.getScript(root + 'flowgen/js-yaml.min.js').then(function () {
      return $.getScript(root + 'flowgen/flowgen.js');
    });
    return loading;
  }

  function status(text, isError) {
    $('#flowgen-status').text(text || '').toggleClass('flowgen-error', !!isError);
  }

  function render() {
    var list = $('#flowgen-op-list').empty();
    selected = null;
    $('#flowgen-select-btn').hide();
    okButton(false);
    if (!doc) { return; }
    var result;
    try {
      result = flowgen.listOperations(doc);
    } catch (err) {
      status(err.message, true);
      return;
    }
    if (!result.count) {
      status('no operations found in this document', true);
      return;
    }
    status('');
    result.operations.forEach(function (op) {
      $('<div>').addClass('flowgen-op')
        .append($('<span>').addClass('flowgen-method').text(op.method.toUpperCase()))
        .append($('<span>').text(op.path))
        .append($('<span>').addClass('flowgen-summary').text(op.summary || ''))
        .on('click', function () {
          $('#flowgen-op-list .flowgen-op').removeClass('selected');
          $(this).addClass('selected');
          selected = op;
          okButton(true);
        })
        .appendTo(list);
    });

    if (result.count === 1) {
      selected = result.operations[0];
      $('#flowgen-op-list .flowgen-op').addClass('selected');
      okButton(true);
    } else {
      $('#flowgen-select-btn').show();
    }
  }

  function reset() {
    doc = null;
    selected = null;
    $('#flowgen-op-list').empty();
    $('#flowgen-select-btn').hide();
    okButton(false);
  }

  function parse(text) {
    reset();
    if (!text || !text.trim()) { status(''); return; }
    if (flowgen.isUrl(text)) { return fetchSpec(text.trim()); }
    try {
      doc = flowgen.parseDocument(text);
      render();
    } catch (err) {
      status(err.message, true);
    }
  }

  function fetchSpec(url) {
    if (fetching === url) { return; }
    fetching = url;
    status('fetching ' + url);
    fetch(url).then(function (res) {
      if (!res.ok) { throw new Error('HTTP ' + res.status + ' from ' + url); }
      return res.text();
    }).then(function (text) {
      fetching = null;
      var pretty = text;
      try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (err) { pretty = text; }
      $('#flowgen-spec-text').val(pretty);
      parse(pretty);
    }).catch(function (err) {
      fetching = null;
      status('could not fetch the document: ' + err.message, true);
    });
  }

  function content() {
    var el = $('<div>').attr('id', TAB_ID);

    var paste = $('<div>').attr('id', 'flowgen-paste-view').addClass('flowgen-on').appendTo(el);

    $('<div>').addClass('flowgen-bar').attr('id', 'flowgen-prompt')
      .append($('<span>').text('Paste an API Specification or its URL, or '))
      .append($('<a>').addClass('red-ui-button').attr('id', 'flowgen-file-btn')
        .append('<i class="fa fa-upload"></i> ')
        .append($('<span>').text('select a file')))
      .append($('<input>').attr({ type: 'file', id: 'flowgen-file', accept: '.json,.yaml,.yml' })
        .css('display', 'none'))
      .append($('<span>').addClass('flowgen-spacer'))
      .append($('<a>').addClass('red-ui-button').attr({ id: 'flowgen-select-btn', href: '#' })
        .text('Select endpoint').hide())
      .on('keydown', function (ev) { if (ev.keyCode === 13) { ev.preventDefault(); } })
      .appendTo(paste);

    $('<div>').addClass('flowgen-grow')
      .append($('<textarea>').attr({ id: 'flowgen-spec-text', placeholder: PLACEHOLDER }))
      .appendTo(paste);

    var select = $('<div>').attr('id', 'flowgen-select-view').appendTo(el);

    $('<div>').addClass('flowgen-bar')
      .append($('<span>').text('Choose the endpoint to import.'))
      .append($('<span>').addClass('flowgen-spacer'))
      .append($('<a>').addClass('red-ui-button').attr({ id: 'flowgen-back-btn', href: '#' })
        .append('<i class="fa fa-chevron-left"></i> ')
        .append($('<span>').text('Back')))
      .appendTo(select);

    $('<div>').addClass('flowgen-grow')
      .append($('<div>').attr('id', 'flowgen-op-list'))
      .appendTo(select);

    $('<div>').attr('id', 'flowgen-status').appendTo(el);

    el.find('#flowgen-select-btn').on('click', function (ev) {
      ev.preventDefault();
      view('select');
    });
    el.find('#flowgen-back-btn').on('click', function (ev) {
      ev.preventDefault();
      view('paste');
    });

    el.find('#flowgen-file-btn').on('click', function (ev) {
      ev.preventDefault();
      el.find('#flowgen-file').val('').trigger('click');
    });
    el.find('#flowgen-file').on('change', function () {
      var file = this.files && this.files[0];
      if (!file) { return; }
      var reader = new FileReader();
      reader.onload = function (ev) {
        $('#flowgen-spec-text').val(ev.target.result);
        parse(ev.target.result);
      };
      reader.readAsText(file);
    });
    el.find('#flowgen-spec-text').on('change paste keyup', function () {
      var text = $(this).val();
      clearTimeout(el.data('timer'));
      el.data('timer', setTimeout(function () { parse(text); }, 250));
    });

    return el;
  }

  function view(name) {
    $('#flowgen-paste-view').toggleClass('flowgen-on', name === 'paste');
    $('#flowgen-select-view').toggleClass('flowgen-on', name === 'select');
  }

  function active() {
    return isActive && $('#' + TAB_ID).length > 0;
  }

  function okButton(enabled) {
    var ok = $('#red-ui-clipboard-dialog-ok');
    if (ok.button && ok.data('ui-button')) {
      ok.button(enabled ? 'enable' : 'disable');
    } else {
      ok.prop('disabled', !enabled);
    }
  }

  function show() {
    $('#red-ui-clipboard-dialog-import-tabs-content').children().hide();
    $('#' + TAB_ID).show().addClass('flowgen-shown');
    isActive = true;
  }

  function hide(targetContentId) {
    isActive = false;
    $('#' + TAB_ID).hide().removeClass('flowgen-shown');
    if (targetContentId) { $('#' + targetContentId).show(); }
    okButton(false);
    $('#red-ui-clipboard-dialog-import-text').trigger('keyup');
  }

  function importSelected() {
    if (!doc || !selected) { return; }
    var nodes;
    try {
      nodes = flowgen.buildFlow(doc, selected.method, selected.path, { tab: false });
    } catch (err) {
      status(err.message, true);
      return;
    }
    var newFlow = $('#red-ui-clipboard-dialog-import-opt > a.selected')
      .attr('id') === 'red-ui-clipboard-dialog-import-opt-new';
    RED.view.importNodes(nodes, { generateIds: true, addFlow: newFlow });
    $('#red-ui-clipboard-dialog').dialog('close');
    RED.view.focus();
  }

  function preventSubmit() {
    $('#red-ui-clipboard-dialog').find('form').off('submit.flowgen')
      .on('submit.flowgen', function (ev) { ev.preventDefault(); });
  }

  function interceptOk() {
    var ok = document.getElementById('red-ui-clipboard-dialog-ok');
    if (!ok || ok.getAttribute('data-flowgen-bound')) { return; }
    ok.setAttribute('data-flowgen-bound', 'true');
    ok.addEventListener('click', function (ev) {
      if (!active()) { return; }
      ev.preventDefault();
      ev.stopPropagation();
      if (ev.stopImmediatePropagation) { ev.stopImmediatePropagation(); }
      importSelected();
    }, true);
  }

  function install() {
    var tabs = $('#red-ui-clipboard-dialog-import-tabs');
    if (!tabs.length || tabs.find('#flowgen-tab-link').length) { return; }

    var li = $('<li>').attr('id', 'red-ui-tab-' + TAB_ID).addClass('red-ui-tab')
      .append($('<a>').attr({ id: 'flowgen-tab-link', href: '#' })
        .addClass('red-ui-tab-label').text('API Spec'))
      .appendTo(tabs);

    content().appendTo('#red-ui-clipboard-dialog-import-tabs-content');

    interceptOk();
    preventSubmit();

    li.on('click', function (ev) {
      ev.preventDefault();
      tabs.find('li').removeClass('active');
      li.addClass('active');
      show();
      view(selected || !doc ? 'paste' : 'select');
      okButton(!!selected);
      load().then(function () {
        parse($('#flowgen-spec-text').val());
      }).catch(function (err) {
        status('failed to load flowgen: ' + err, true);
      });
    });

    tabs.on('click', 'li', function () {
      if (this === li[0]) { return; }
      li.removeClass('active');
      hide(String(this.id || '').replace(/^red-ui-tab-/, ''));
    });
  }

  RED.plugins.registerPlugin('node-red-flowgen', {
    onadd: function () {
      $(document).on('dialogopen', function (ev) {
        if (ev.target && ev.target.id === 'red-ui-clipboard-dialog') {
          setTimeout(install, 0);
        }
      });
    }
  });
})();
</script>
