name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Generation, CLI and Bruno tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee out.txt || {
            (grep -A 18 "^not ok" out.txt | head -80; echo "--- tail ---"; tail -20 out.txt) | while read -r line; do
              echo "::error::Generation, CLI and Bruno tests: $line"
            done
            exit 1
          }
      - name: Editor UI tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:ui 2>&1 | tee out.txt || {
            (grep -A 18 "^not ok" out.txt | head -80; echo "--- tail ---"; tail -20 out.txt) | while read -r line; do
              echo "::error::Editor UI tests: $line"
            done
            exit 1
          }
      - name: Node-RED integration tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:nodered 2>&1 | tee out.txt || {
            (grep -A 18 "^not ok" out.txt | head -80; echo "--- tail ---"; tail -20 out.txt) | while read -r line; do
              echo "::error::Node-RED integration tests: $line"
            done
            exit 1
          }
      - name: Command line picker tests
        if: runner.os == 'Linux'
        run: npm run test:wizard

      - name: Plugin package tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:plugin 2>&1 | tee out.txt || {
            (grep -A 18 "^not ok" out.txt | head -80; echo "--- tail ---"; tail -20 out.txt) | while read -r line; do
              echo "::error::Plugin package tests: $line"
            done
            exit 1
          }

  browser:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: ubuntu-latest
            browser: webkit
          - os: windows-latest
            browser: msedge
          - os: macos-latest
            browser: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: npm install
      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.browser == 'msedge' && 'msedge' || matrix.browser }}
      - name: Editor tests in ${{ matrix.browser }}
        shell: bash
        env:
          BROWSERS: ${{ matrix.browser }}
          BROWSER_COVERAGE_DIR: ${{ github.workspace }}/browser-coverage
        run: |
          set -o pipefail
          passed=0
          for attempt in 1 2; do
            if npm run test:browser 2>&1 | tee browser.log; then
              passed=1
              break
            fi
            echo "::notice::${{ matrix.browser }}: attempt ${attempt} failed"
          done
          if [ "$passed" != "1" ]; then
            (grep -A 14 "not ok" browser.log | head -70; echo "--- tail ---"; \
             tail -25 browser.log) | while read -r line; do
              echo "::error::${{ matrix.browser }}: ${line}"
            done
            exit 1
          fi

      - name: Report the editor script coverage
        if: matrix.browser == 'chromium'
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const file = "browser-coverage/browser-coverage.json";
            if (!fs.existsSync(file)) { console.log("::warning::no browser coverage"); return; }
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            for (const [name, c] of Object.entries(data)) {
              const s = Object.values(c.s), f = Object.values(c.f);
              const pct = a => a.length ? Math.round(a.filter(n => n > 0).length / a.length * 100) : 0;
              console.log("::notice::" + name.split("/").pop() +
                " statements " + pct(s) + "% functions " + pct(f) + "%");
            }
          '

      - uses: actions/upload-artifact@v7
        if: matrix.browser == 'chromium'
        id: browser-coverage
        with:
          name: editor-coverage
          path: browser-coverage

      - name: Report where to download the editor coverage
        if: matrix.browser == 'chromium'
        run: |
          echo "::notice::Editor coverage: ${{ steps.browser-coverage.outputs.artifact-url }}"

  live:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: npm install
      - name: Call real public APIs through Node-RED
        run: npm run test:live

      - name: Call a corpus of public APIs through Node-RED
        env:
          LIVE_CORPUS: '1'
        run: npm run test:live

  ollama:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: npm install

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull the model
        run: |
          set -e
          ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/version && break
            sleep 1
          done
          ollama pull "$OLLAMA_MODEL"
          ollama list
        env:
          OLLAMA_MODEL: gemma3:270m

      - name: Exercise every Ollama endpoint through Node-RED
        shell: bash
        env:
          OLLAMA_URL: http://127.0.0.1:11434
          OLLAMA_MODEL: gemma3:270m
        run: |
          set -o pipefail
          npm run test:ollama 2>&1 | tee ollama-tests.log || {
            (grep -E "^not ok|  error:" ollama-tests.log | head -25; \
             echo '--- server log ---'; tail -30 ollama.log) | while read -r line; do
              echo "::error::ollama: ${line}"
            done
            exit 1
          }

  samples:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: npm install

      - name: Generate the JavaScript for every endpoint
        run: npm run samples

      - uses: actions/upload-artifact@v7
        id: samples-artifact
        with:
          name: generated-code
          path: samples

      - name: Report where to download the generated code
        run: |
          echo "::notice::Generated code: ${{ steps.samples-artifact.outputs.artifact-url }}"
          echo "Generated code: ${{ steps.samples-artifact.outputs.artifact-url }}" \
            >> "$GITHUB_STEP_SUMMARY"

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: npm install

      - name: Measure coverage
        shell: bash
        run: |
          set -o pipefail
          npm run coverage 2>&1 | tee coverage.log
          {
            echo '## Coverage'
            echo
            echo '```'
            sed -n '/Coverage summary/,/^=\{10,\}$/p' coverage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        id: coverage-artifact
        with:
          name: coverage-report
          path: coverage

      - name: Report where to download the coverage report
        run: |
          echo "::notice::Coverage report: ${{ steps.coverage-artifact.outputs.artifact-url }}"
          echo "Coverage report: ${{ steps.coverage-artifact.outputs.artifact-url }}" \
            >> "$GITHUB_STEP_SUMMARY"

  release:
    runs-on: ubuntu-latest
    needs: [test, browser, live, coverage, ollama, samples]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org

      - run: npm install

      - name: Build the tarball
        run: |
          set -e
          npm pack
          mv node-red-flowgen-*.tgz node-red-flowgen.tgz
          tar tzf node-red-flowgen.tgz

      - name: Check the tag matches package.json
        run: |
          set -e
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json is $PKG_VERSION but the tag is $TAG_VERSION" >&2
            exit 1
          fi

      - name: Remove older releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName --jq '.[].tagName' > releases.txt || true
          while read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done < releases.txt
          git ls-remote --tags origin | awk '{print $2}' | sed 's|refs/tags/||' \
            | grep -v '\^{}' | sort -u > tags.txt || true
          while read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            git push origin ":refs/tags/$tag" || true
          done < tags.txt

      - name: Publish the release with the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "$GITHUB_REF_NAME" node-red-flowgen.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "cd ~/.node-red && npm install ./node-red-flowgen.tgz" \
          || gh release upload "$GITHUB_REF_NAME" node-red-flowgen.tgz \
               --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping npm publish"
            exit 0
          fi
          npm publish --access public
