openapi: 3.0.3
info:
  title: ollama-bruno
  version: 1.0.0
servers:
  - url: https://api.example.test
paths:
  /api/chat:
    post:
      summary: api-chat
      responses:
        '200':
          description: ok
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - messages
                - stream
                - think
                - format
                - keep_alive
                - tools
                - options
              properties:
                model:
                  type: string
                  example: '{{model}}'
                messages:
                  type: array
                  items:
                    type: object
                    required:
                      - role
                      - content
                      - images
                    properties:
                      role:
                        type: string
                        example: user
                      content:
                        type: string
                        example: Hello
                      images:
                        type: array
                        items:
                          type: string
                          example: ''
                        example: &ref_0
                          - ''
                  example:
                    - role: user
                      content: Hello
                      images: *ref_0
                stream:
                  type: boolean
                  example: false
                think:
                  type: boolean
                  example: false
                format:
                  type: string
                  example: json
                keep_alive:
                  type: string
                  example: 5m
                tools:
                  type: array
                  items:
                    type: object
                    required: []
                    properties: {}
                  example:
                    - {}
                options:
                  type: object
                  required:
                    - temperature
                    - num_predict
                    - seed
                  properties:
                    temperature:
                      type: number
                      example: 0.8
                    num_predict:
                      type: integer
                      example: 16
                    seed:
                      type: integer
                      example: 0
  /api/copy:
    post:
      summary: api-copy
      responses:
        '200':
          description: ok
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source
                - destination
              properties:
                source:
                  type: string
                  example: gemma3:4b
                destination:
                  type: string
                  example: gemma3:4b-copy
  /api/create:
    post:
      summary: api-create
      responses:
        '200':
          description: ok
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - from
                - system
                - stream
              properties:
                model:
                  type: string
                  example: '{{model}}'
                from:
                  type: string
                  example: gemma3:4b
                system:
                  type: string
                  example: You are helpful.
                stream:
                  type: boolean
                  example: false
  /api/delete:
    delete:
      summary: api-delete
      responses:
        '200':
          description: ok
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
              properties:
                model:
                  type: string
                  example: '{{model}}'
  /api/embed:
    post:
      summary: api-embed
      responses:
        '200':
          description: ok
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - input
                - truncate
                - keep_alive
                - options
              properties:
                model:
                  type: string
                  example: '{{model}}'
                input:
                  type: string
                  example: Why is the sky blue?
                truncate:
                  type: boolean
                  example: true
                keep_alive:
                  type: string
                  example: 5m
                options:
                  type: object
                  required: []
                  properties: {}
  /api/embeddings:
    post:
      summary: api-embeddings
      responses:
        '200':
          description: ok
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - prompt
                - keep_alive
              properties:
                model:
                  type: string
                  example: '{{model}}'
                prompt:
                  type: string
                  example: Why is the sky blue?
                keep_alive:
                  type: string
                  example: 5m
  /api/generate:
    post:
      summary: api-generate
      responses:
        '200':
          description: ok
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - prompt
                - suffix
                - system
                - template
                - context
                - stream
                - raw
                - think
                - format
                - keep_alive
                - images
                - options
              properties:
                model:
                  type: string
                  example: '{{model}}'
                prompt:
                  type: string
                  example: Why is the sky blue?
                suffix:
                  type: string
                  example: ''
                system:
                  type: string
                  example: ''
                template:
                  type: string
                  example: ''
                context:
                  type: array
                  items:
                    type: integer
                    example: 0
                  example:
                    - 0
                stream:
                  type: boolean
                  example: false
                raw:
                  type: boolean
                  example: false
                think:
                  type: boolean
                  example: false
                format:
                  type: string
                  example: json
                keep_alive:
                  type: string
                  example: 5m
                images:
                  type: array
                  items:
                    type: string
                    example: ''
                  example:
                    - ''
                options:
                  type: object
                  required:
                    - temperature
                    - top_k
                    - top_p
                    - seed
                    - num_predict
                    - num_ctx
                    - stop
                  properties:
                    temperature:
                      type: number
                      example: 0.8
                    top_k:
                      type: integer
                      example: 40
                    top_p:
                      type: number
                      example: 0.9
                    seed:
                      type: integer
                      example: 0
                    num_predict:
                      type: integer
                      example: 16
                    num_ctx:
                      type: integer
                      example: 2048
                    stop:
                      type: array
                      items:
                        type: string
                        example: ''
                      example:
                        - ''
  /api/ps:
    get:
      summary: api-ps
      responses:
        '200':
          description: ok
  /api/pull:
    post:
      summary: api-pull
      responses:
        '200':
          description: ok
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - insecure
                - stream
              properties:
                model:
                  type: string
                  example: '{{model}}'
                insecure:
                  type: boolean
                  example: false
                stream:
                  type: boolean
                  example: false
  /api/push:
    post:
      summary: api-push
      responses:
        '200':
          description: ok
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - insecure
                - stream
              properties:
                model:
                  type: string
                  example: '{{model}}'
                insecure:
                  type: boolean
                  example: false
                stream:
                  type: boolean
                  example: false
  /api/show:
    post:
      summary: api-show
      responses:
        '200':
          description: ok
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - verbose
              properties:
                model:
                  type: string
                  example: '{{model}}'
                verbose:
                  type: boolean
                  example: false
  /api/tags:
    get:
      summary: api-tags
      responses:
        '200':
          description: ok
  /api/version:
    get:
      summary: api-version
      responses:
        '200':
          description: ok
  /v1/chat/completions:
    post:
      summary: v1-chat-completions
      responses:
        '200':
          description: ok
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - messages
                - stream
                - temperature
                - max_tokens
                - seed
              properties:
                model:
                  type: string
                  example: '{{model}}'
                messages:
                  type: array
                  items:
                    type: object
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                        example: user
                      content:
                        type: string
                        example: Hello
                  example:
                    - role: user
                      content: Hello
                stream:
                  type: boolean
                  example: false
                temperature:
                  type: number
                  example: 0.8
                max_tokens:
                  type: integer
                  example: 1000
                seed:
                  type: integer
                  example: 0
  /v1/completions:
    post:
      summary: v1-completions
      responses:
        '200':
          description: ok
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - prompt
                - stream
                - max_tokens
              properties:
                model:
                  type: string
                  example: '{{model}}'
                prompt:
                  type: string
                  example: Why is the sky blue?
                stream:
                  type: boolean
                  example: false
                max_tokens:
                  type: integer
                  example: 1000
  /v1/embeddings:
    post:
      summary: v1-embeddings
      responses:
        '200':
          description: ok
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - input
              properties:
                model:
                  type: string
                  example: '{{model}}'
                input:
                  type: string
                  example: Why is the sky blue?
  /v1/models:
    get:
      summary: v1-models
      responses:
        '200':
          description: ok
