openapi: 3.0.3
info:
  title: httpbingo
  description: >-
    The authentication endpoints of the httpbingo.org service, kept as a small sample of how bearer,
    basic and digest schemes reach the generated code.
  version: 1.0.0
servers:
  - url: https://httpbingo.org
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic
    digestAuth:
      type: http
      scheme: digest
paths:
  /bearer:
    get:
      summary: Require a bearer token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
        '401':
          description: No bearer token was supplied
  /basic-auth/{user}/{passwd}:
    get:
      summary: Require basic authentication
      security:
        - basicAuth: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
        - name: passwd
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Credentials were missing or wrong
  /digest-auth/{qop}/{user}/{passwd}:
    get:
      summary: Require digest authentication
      description: >-
        Digest authentication needs a challenge and response exchange, so a single generated request
        answers with 401 until the digest header is built from the server nonce.
      security:
        - digestAuth: []
      parameters:
        - name: qop
          in: path
          required: true
          schema:
            type: string
            enum:
              - auth
        - name: user
          in: path
          required: true
          schema:
            type: string
        - name: passwd
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authenticated
        '401':
          description: Credentials were missing or wrong
